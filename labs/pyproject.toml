description = "Lab notebooks for the SDAIA Academy course DS-404 Advanced Modelling for Structured Data"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "pulp>=3.0",
    "highspy>=1.7",
    "jupyterlab>=4.4",
]

[tool.uv]
package = false
