<section>
<h2>Day 1: Pretrained models for tables</h2>
<ol>
<li><p>Sarab's baseline scores 0.80 AUC under random 5-fold and 0.78 under 5-fold grouped by customer. Bustan will use the model on next quarter's orders, many from new customers. Which number goes in the memo?</p><ul><li><b>A.</b> 0.80, because it is the model's best result</li><li><b>B.</b> 0.78, because the folds keep each customer on one side</li><li><b>C.</b> 0.79, the average of the two schemes</li><li><b>D.</b> Either, as long as the memo names the scheme</li></ul></li>
<li><p>The pretrained model took 0.3 seconds per fold and the baseline 0.4. Rafif concludes the pretrained model is cheaper. What is missing from his comparison?</p><ul><li><b>A.</b> The type of processor each model ran on</li><li><b>B.</b> Nothing: fit time is the cost that matters</li><li><b>C.</b> The 103 fits the baseline's tuning cost before that fit</li><li><b>D.</b> The AUC of each model on the same folds</li></ul></li>
<li><p>At 500 orders, three repeats give the pretrained model a mean AUC 0.011 above the tuned baseline. The 95% interval of the paired difference runs from -0.031 to +0.052. What goes in the memo?</p><ul><li><b>A.</b> No difference detectable at 500 orders with three repeats</li><li><b>B.</b> The pretrained model wins on small data</li><li><b>C.</b> The two models are equally accurate at 500 orders</li><li><b>D.</b> The comparison is invalid and should be dropped</li></ul></li>
<li><p>A benchmark table shows a pretrained model winning 30 of 32 datasets. Which single fact, if true, most undermines the claim?</p><ul><li><b>A.</b> The pretrained model was slower on every dataset</li><li><b>B.</b> Most of the datasets are publicly available</li><li><b>C.</b> Half of the datasets have fewer than 3,000 rows</li><li><b>D.</b> The boosted trees were run at default settings</li></ul></li>
<li><p>A pretrained tabular model scores 0.781 AUC in one 40-second run. Your LightGBM scores 0.779 after a search of 103 fits that took 25 seconds. Which comparison is fair?</p><ul><li><b>A.</b> The pretrained model wins: it scored higher</li><li><b>B.</b> LightGBM wins: it needed less time</li><li><b>C.</b> Accuracy with intervals for both, and the full time each took, tuning included, on the same folds</li><li><b>D.</b> Neither: models of different families cannot be compared</li></ul></li>
<li><p>Bustan's 1,500 customers each place dozens of orders. The late-delivery model will score orders from customers it has never seen. Which cross-validation estimates that?</p><ul><li><b>A.</b> Folds grouped by customer, so that no customer is on both sides</li><li><b>B.</b> Random 5-fold, because it uses every order</li><li><b>C.</b> Stratified folds on the late flag</li><li><b>D.</b> Leave-one-order-out</li></ul></li>
<li><p>At 1,000 orders the pretrained model scores 0.760 and the tuned baseline 0.752; the paired difference is +0.008 with a 95% interval from -0.019 to +0.035. What do you report?</p><ul><li><b>A.</b> The pretrained model wins at 1,000 orders</li><li><b>B.</b> The baseline wins: its interval is wider</li><li><b>C.</b> The models are proven equal at 1,000 orders</li><li><b>D.</b> No difference can be told apart at 1,000 orders with these repeats</li></ul></li>
<li><p>A vendor reports wins on 20 of 24 datasets. You learn that 8 of the 24 were in the suite used to select the model during pretraining. What do you do first?</p><ul><li><b>A.</b> Accept the claim: 20 of 24 is a large majority</li><li><b>B.</b> Drop the 8 overlapping datasets and recount with paired intervals</li><li><b>C.</b> Ask for more datasets of the same kind</li><li><b>D.</b> Rerun only the 4 losses</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Forecasting with pretrained models</h2>
<ol>
<li><p>Yesterday the learning curves of the tuned baseline and the pretrained model overlapped at every size, with paired intervals around zero. Which new evidence would justify writing "the pretrained model wins below 1,000 orders"?</p><ul><li><b>A.</b> A vendor table with 35 wins out of 36</li><li><b>B.</b> A higher mean AUC at 500 orders in one more run</li><li><b>C.</b> More repeats at 500 and 1,000 orders whose paired interval stays above zero</li><li><b>D.</b> Rerunning the curves with random K-fold instead of held-out customers</li></ul></li>
<li><p>The zero-shot forecaster scores 0.75 of the floor's quantile loss; the tuned LightGBM scores 0.61. Ahlam asks whether the pretrained model is worth keeping. What is the best answer today?</p><ul><li><b>A.</b> Not as a replacement; test where it wins and what it adds to an ensemble first</li><li><b>B.</b> No: it loses to LightGBM, so it has no use</li><li><b>C.</b> Yes: it needs no training, so it should replace LightGBM</li><li><b>D.</b> Yes: it beats the floor, which is all a forecaster must do</li></ul></li>
<li><p>For 60 short series the zero-shot forecaster and smoothing differ by -0.009 in scaled quantile loss, with a 95% interval from -0.064 to +0.050. Both trail LightGBM by about 0.19. What do you recommend for new products?</p><ul><li><b>A.</b> Switch new products to the zero-shot model, which scored lower</li><li><b>B.</b> Keep smoothing because the two are proven equal</li><li><b>C.</b> Treat short series as unforecastable and order by hand</li><li><b>D.</b> Use the tuned LightGBM, which wins the group, and retest the pretrained model later</li></ul></li>
<li><p>A planner forecasts dates (the fruit) for next Ramadan by copying last year. Bustan's demand is low on Fridays. Which single lag gives the smallest error over Ramadan and Eid?</p><ul><li><b>A.</b> 364 days, one Gregorian year in whole weeks</li><li><b>B.</b> 357 days, 51 whole weeks</li><li><b>C.</b> 354 days, one Hijri year</li><li><b>D.</b> 365 days, one calendar year</li></ul></li>
<li><p>An analyst fits stacking weights on all six origins and reports that the stack beats the best single model on origins three to six. What is wrong?</p><ul><li><b>A.</b> Four members are too many for six origins</li><li><b>B.</b> The weights were fitted on quantile loss</li><li><b>C.</b> The weights saw the windows they are scored on</li><li><b>D.</b> The best single model was the tuned LightGBM</li></ul></li>
<li><p>Pre-work. A forecaster's 0.9 quantile for tomorrow is 120 cases; 100 cases are sold. What is the pinball loss at tau 0.9?</p><ul><li><b>A.</b> 2</li><li><b>B.</b> 18</li><li><b>C.</b> 20</li><li><b>D.</b> 10</li></ul></li>
<li><p>Pre-work. A forecaster's 80% bands held the actual demand on 62 of 100 days. What does that tell you?</p><ul><li><b>A.</b> The bands are too wide</li><li><b>B.</b> The bands are too narrow: the forecaster is more confident than it should be</li><li><b>C.</b> The median forecast is biased</li><li><b>D.</b> Nothing: 62% is close enough to 80%</li></ul></li>
<li><p>Why are forecast errors divided by each series' own naive error before averaging over 400 series?</p><ul><li><b>A.</b> So that high-volume staples do not decide the average alone</li><li><b>B.</b> To turn the errors into percentages</li><li><b>C.</b> Because pretrained models need scaled inputs</li><li><b>D.</b> To remove the effect of holidays</li></ul></li>
<li><p>A zero-shot forecaster was scored on the last four weeks of data; the supplied benchmarks on six rolling origins over eight months. The zero-shot score is better. What do you conclude?</p><ul><li><b>A.</b> The zero-shot forecaster is better</li><li><b>B.</b> The benchmarks are better: they were tested more</li><li><b>C.</b> Nothing yet: score the zero-shot forecaster at the same six origins and horizon</li><li><b>D.</b> Average the two scores</li></ul></li>
<li><p>Over the last year a catering product sold on one day in three on average (ADI 3.0), with sizes that vary little. How does the lab classify it at that origin?</p><ul><li><b>A.</b> Regular</li><li><b>B.</b> Short</li><li><b>C.</b> Ramadan item</li><li><b>D.</b> Intermittent</li></ul></li>
<li><p>Which input may be passed as a known future covariate when forecasting the next 28 days of dates (the fruit) at Riyadh?</p><ul><li><b>A.</b> The Ramadan and Eid days in the next 28 days from the Umm al-Qura calendar</li><li><b>B.</b> Next week's actual sales of dates at Jeddah</li><li><b>C.</b> The actual temperature of the next 28 days</li><li><b>D.</b> The total of next month's orders</li></ul></li>
<li><p>Stacking weights for the origin 2026-03-15 are fitted on the forecasts of all six origins. What is wrong?</p><ul><li><b>A.</b> Nothing: more origins give better weights</li><li><b>B.</b> The weights saw the window they are scored on</li><li><b>C.</b> Six origins are too few for four weights</li><li><b>D.</b> Weights must be fitted per series</li></ul></li>
<li><p>When is the simple average of four forecasters most likely to lose to the best single one?</p><ul><li><b>A.</b> When the four forecasters are about equally good</li><li><b>B.</b> When the series are long</li><li><b>C.</b> When one forecaster is far better than the others</li><li><b>D.</b> When the forecasts are quantiles</li></ul></li>
<li><p>A stack beats the best single model by 0.3% in scaled quantile loss, with a 95% bootstrap interval over series from -0.1% to +0.7%. What do you tell Ahlam?</p><ul><li><b>A.</b> Adopt the stack: it is better on average</li><li><b>B.</b> Drop the stack: it is worse</li><li><b>C.</b> The stack is proven equal to the best model</li><li><b>D.</b> The gain is not established; keep the single model unless more windows separate them</li></ul></li>
<li><p>Forecasts will be judged by scaled quantile loss. On which loss should the stacking weights be fitted?</p><ul><li><b>A.</b> Scaled quantile loss, on earlier windows</li><li><b>B.</b> Squared error of the medians, because it is smooth</li><li><b>C.</b> Accuracy of the 0.5 quantile only</li><li><b>D.</b> Whichever loss gives the largest weight to the newest model</li></ul></li>
<li><p>A demand model was validated on January and February 2026 and will forecast the weeks before Eid al-Fitr 1448. Which validation estimates that error?</p><ul><li><b>A.</b> The January and February scores, since they are recent</li><li><b>B.</b> Random days from the last year</li><li><b>C.</b> Rolling origins whose test windows covered the weeks before the past Eids al-Fitr</li><li><b>D.</b> A split by product</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: From forecast to order</h2>
<ol>
<li><p>Yesterday's stack beat the tuned LightGBM by 0.4% in scaled quantile loss, with a 95% interval from +0.0012 to +0.0028. What is still missing before Ahlam can decide?</p><ul><li><b>A.</b> Nothing: the interval excludes zero, so adopt the stack</li><li><b>B.</b> Six more origins to narrow the interval</li><li><b>C.</b> What 0.4% less loss is worth in riyals, against the cost of running four models</li><li><b>D.</b> A comparison with the seasonal naive floor</li></ul></li>
<li><p>A chilled yoghurt line: a case short costs SAR 12 in margin and goodwill; a case left over costs SAR 36, mostly spoilage. Which quantile of next week's demand should Imad order?</p><ul><li><b>A.</b> The 0.75 quantile</li><li><b>B.</b> The 0.33 quantile</li><li><b>C.</b> The median</li><li><b>D.</b> The 0.25 quantile</li></ul></li>
<li><p>The plan uses both reefers, so the reefer constraint has zero slack. The two reefers carry 53.5 of their 80 cubic metres. A haulier offers a third reefer for SAR 900 this week. What do you tell Imad?</p><ul><li><b>A.</b> Accept: the reefer constraint binds, so more reefers help</li><li><b>B.</b> Decline: re-solving with three reefers would not change the plan, because dairy already fits</li><li><b>C.</b> Accept: a third reefer frees depot space for dry goods</li><li><b>D.</b> Accept: it is cheaper than the SAR 1,703 that capacity is worth</li></ul></li>
<li><p>At the origin 2026-05-10 the zero-shot forecaster has the lower scaled quantile loss of the two, yet its orders cost SAR 5,000 more than smoothing's over the four weeks. Which explanation fits?</p><ul><li><b>A.</b> The scaled quantile loss was computed wrongly</li><li><b>B.</b> Regret depends on demand, not on the forecaster</li><li><b>C.</b> Its errors fell where they cost most: dairy overage and the Eid al-Adha week</li><li><b>D.</b> Smoothing is the better forecaster for Bustan</li></ul></li>
<li><p>Rice and sugar each run short in 10% of weeks. A planner reports a 1% chance that both run short in the same week. When is that report most wrong?</p><ul><li><b>A.</b> When a shared shock, such as a pre-Eid rush, lifts both demands in the same week</li><li><b>B.</b> When both come from the same supplier</li><li><b>C.</b> When each product's days are independent of each other</li><li><b>D.</b> When the forecaster's bands are too wide</li></ul></li>
<li><p>Pre-work. A case short costs SAR 30 and a case left over SAR 10. Next week's demand is roughly normal with mean 400 and standard deviation 50. About how many cases should be ordered?</p><ul><li><b>A.</b> 400</li><li><b>B.</b> 375</li><li><b>C.</b> 434</li><li><b>D.</b> 466</li></ul></li>
<li><p>Pre-work. Imad writes the week's order as a linear programme. Which of these is a constraint?</p><ul><li><b>A.</b> Minimise the cost of trips plus the cost of shortages</li><li><b>B.</b> The number of cases of rice to order</li><li><b>C.</b> The SAR 2,400 a truck trip costs</li><li><b>D.</b> The volume ordered from one supplier fits the trucks booked for it</li></ul></li>
<li><p>Forecaster A has lower scaled quantile loss than B over a quarter, but A's orders cost more. Which explanation fits best?</p><ul><li><b>A.</b> Regret does not depend on the forecaster</li><li><b>B.</b> A's errors fall on products and quantiles where errors cost most</li><li><b>C.</b> The loss was computed on the wrong days</li><li><b>D.</b> B was tuned on the test quarter</li></ul></li>
<li><p>In the solved plan the limit of two reefers has zero slack. Re-solving with three reefers gives the same objective. What is the third reefer worth this week?</p><ul><li><b>A.</b> SAR 3,200, the price of a trip</li><li><b>B.</b> As much as the depot space is worth</li><li><b>C.</b> Nothing: the constraint is tight but does not limit the plan</li><li><b>D.</b> It cannot be known without the dual prices</li></ul></li>
<li><p>The dry goods need 75 cubic metres; a truck carries 60. A linear relaxation books 1.25 trucks. Why are trucks integer variables?</p><ul><li><b>A.</b> To make the solver faster</li><li><b>B.</b> Because cases are integers</li><li><b>C.</b> Because 1.25 trucks is easier to round later</li><li><b>D.</b> Because a trip is paid whole: 1.25 trucks underprices the plan</li></ul></li>
<li><p>A plan's simulation assumes products are independent and reports a 2% chance that five products run short in the same week. Past errors show a shared weekly shock. What happens to that 2%?</p><ul><li><b>A.</b> It rises: shared shocks make shortages arrive together</li><li><b>B.</b> It falls: shared shocks cancel out</li><li><b>C.</b> It stays: each product's own risk is unchanged</li><li><b>D.</b> It cannot change without new orders</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Shift and adoption</h2>
<ol>
<li><p>Over twelve weeks LightGBM's orders cost SAR 2,972 a week less than the zero-shot forecaster's, with a 95% interval from -7,820 to +506. Its scaled quantile loss is clearly lower. What do you report?</p><ul><li><b>A.</b> LightGBM is better: its error is lower</li><li><b>B.</b> LightGBM probably costs less, but twelve weeks cannot separate the two; keep both on test</li><li><b>C.</b> The two forecasters cost the same</li><li><b>D.</b> Smoothing, because it won at one origin</li></ul></li>
<li><p>The adversarial classifier separates northern orders from old ones with AUC 0.95, mostly on driver tenure and distance. What can you conclude before any northern outcome is known?</p><ul><li><b>A.</b> The late model will fail in the north</li><li><b>B.</b> Drop tenure and distance from the late model</li><li><b>C.</b> Many northern orders have few look-alikes in the training data, so its predictions there are untested</li><li><b>D.</b> The north has a higher late rate</li></ul></li>
<li><p>Before the north opened, the analyst reported "AUC 0.87, well calibrated" from random 5-fold validation on the old depots. Knowing what you know now, what should the report have said?</p><ul><li><b>A.</b> A region-held-out AUC near 0.77, and no promise on calibrated probabilities until northern outcomes arrive</li><li><b>B.</b> AUC 0.87, since random folds use the most data</li><li><b>C.</b> A temporal AUC of 0.88, since the north is later in time</li><li><b>D.</b> No estimate at all: nothing measured on old data applies to the north</li></ul></li>
<li><p>After weighting, coverage in the north is 90.1% overall but 81.0% for institutional customers. Which statement is right?</p><ul><li><b>A.</b> The weights are wrong: weighted conformal guarantees 90% in every segment</li><li><b>B.</b> Institutional customers are too few to measure coverage</li><li><b>C.</b> Raising the institutional weights would fix it</li><li><b>D.</b> Weights correct a change in the inputs; the institutional gap is a change in the link, which needs northern outcomes</li></ul></li>
<li><p>A cloud reseller offers the open TabPFN-2.6 weights as a hosted service outside the Kingdom, at SAR 6 per 1,000 predictions, with a strong benchmark score. The task reads Bustan's orders with customer ids. What blocks it first?</p><ul><li><b>A.</b> The price per prediction</li><li><b>B.</b> The licence: its outputs are for non-commercial use only</li><li><b>C.</b> The benchmark score is not high enough</li><li><b>D.</b> Only the transfer of personal data outside the Kingdom</li></ul></li>
<li><p>An adversarial classifier separates last year's orders from this month's with AUC 0.52. What can you conclude?</p><ul><li><b>A.</b> The model will work this month</li><li><b>B.</b> The features show no shift the classifier can see; outcomes may still have shifted</li><li><b>C.</b> There is no shift of any kind</li><li><b>D.</b> The classifier is broken</li></ul></li>
<li><p>A temporal split trains on the first 80% of days and tests on the last 20%. The same customers order in both periods, and the model will serve a new region's customers. What does the temporal score overstate?</p><ul><li><b>A.</b> Nothing: a temporal split never leaks</li><li><b>B.</b> The effect of holidays</li><li><b>C.</b> The size of the region</li><li><b>D.</b> How well the model ranks customers it has not seen</li></ul></li>
<li><p>Weighted conformal intervals use weights from an adversarial classifier. Which shift can they correct?</p><ul><li><b>A.</b> A change in how the features are distributed, with the same link to the outcome</li><li><b>B.</b> A change in the link between distance and lateness</li><li><b>C.</b> Any shift, if the weights are clipped</li><li><b>D.</b> A change in the late rate with the same features</li></ul></li>
<li><p>A model's weights are free to download, but its licence says its outputs may be used for non-commercial purposes only. Bustan wants it to set weekly orders. What follows?</p><ul><li><b>A.</b> Allowed: downloading was free</li><li><b>B.</b> Allowed if it runs on Bustan's own servers</li><li><b>C.</b> Allowed once its accuracy beats the baseline</li><li><b>D.</b> Not allowed without a separate commercial licence</li></ul></li>
<li><p>Bustan's order records hold customer ids of sole traders. A candidate runs only as a cloud endpoint outside the Kingdom. What must happen before those records are sent?</p><ul><li><b>A.</b> Nothing, if the data is encrypted in transit</li><li><b>B.</b> A purpose allowed by the Personal Data Protection Law, a transfer risk assessment and appropriate safeguards, or self-hosting instead</li><li><b>C.</b> Only the customers' consent by email</li><li><b>D.</b> A faster network link</li></ul></li>
<li><p>Running a pretrained forecaster costs about SAR 50 a month self-hosted. The course's evidence shows it does not beat the tuned LightGBM overall. What is the adoption decision?</p><ul><li><b>A.</b> Adopt it: it is cheap</li><li><b>B.</b> Adopt it for every series: it needs no training</li><li><b>C.</b> Not as a replacement; at most as a member where it adds measured value, such as holiday windows</li><li><b>D.</b> Reject pretrained forecasters for good</li></ul></li>
<li><p>A candidate has an Apache-2.0 licence, can be self-hosted in Riyadh and costs little to run, but it was never evaluated on Bustan's data. What is the right decision today?</p><ul><li><b>A.</b> Not now: evaluate it on Bustan's data first</li><li><b>B.</b> Go: the licence, residency and cost all allow it</li><li><b>C.</b> No-go: unevaluated models are never adopted</li><li><b>D.</b> Go with conditions: monitor it after adoption</li></ul></li>
</ol>

igher score as the better one: a higher estimate from a leaky split is only more optimistic","","Averages two estimates as if both were honest: the average keeps half of the leak","Treats the choice of split as a matter of taste: the deployment, not preference, decides which split is honest"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"checkpoint-1","title":"Which estimate goes in the memo?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"The pretrained model took 0.3 seconds per fold and the baseline 0.4. Rafif concludes the pretrained model is cheaper. What is missing from his comparison?","options":[{"key":"A","text":"The type of processor each model ran on"},{"key":"B","text":"Nothing: fit time is the cost that matters"},{"key":"C","text":"The 103 fits the baseline's tuning cost before that fit"},{"key":"D","text":"The AUC of each model on the same folds"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The baseline's single fit was bought with a search; the pretrained model ran with defaults. The table carries tuning time, fit time and predict time.","misconceptions":["Thinks hardware explains everything: both ran on the same CPU here","Treats prediction as free: for an in-context model it is where most of the cost lives, so it must be counted, not dropped","","Confuses accuracy with cost: AUC is a separate column of the same table"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"checkpoint-2","title":"What makes the run-time comparison fair?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"At 500 orders, three repeats give the pretrained model a mean AUC 0.011 above the tuned baseline. The 95% interval of the paired difference runs from -0.031 to +0.052. What goes in the memo?","options":[{"key":"A","text":"No difference detectable at 500 orders with three repeats"},{"key":"B","text":"The pretrained model wins on small data"},{"key":"C","text":"The two models are equally accurate at 500 orders"},{"key":"D","text":"The comparison is invalid and should be dropped"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval contains zero, so the sign is not established. More repeats or more test customers would narrow it; until then, no claim either way.","misconceptions":["","Reads the mean and ignores the interval: a positive mean inside a wide interval is not a win","Reads an interval that contains zero as proof of equality: absence of evidence is not evidence of absence","Blames the method for the sample: more repeats, not a different metric, narrow the interval"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"checkpoint-3","title":"What does this point say?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"A benchmark table shows a pretrained model winning 30 of 32 datasets. Which single fact, if true, most undermines the claim?","options":[{"key":"A","text":"The pretrained model was slower on every dataset"},{"key":"B","text":"Most of the datasets are publicly available"},{"key":"C","text":"Half of the datasets have fewer than 3,000 rows"},{"key":"D","text":"The boosted trees were run at default settings"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An untuned baseline turns tuning effort into \"model quality\": every win may be the budget, not the model.","misconceptions":["Mistakes speed for accuracy: run time is a separate column of the decision","Treats a public dataset as suspect by itself: public data is fine unless the model was built or selected on it","Assumes small tables cannot be evidence: they are exactly where such models claim to help",""],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"checkpoint-4","title":"Which fact voids the claim first?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"Yesterday the learning curves of the tuned baseline and the pretrained model overlapped at every size, with paired intervals around zero. Which new evidence would justify writing \"the pretrained model wins below 1,000 orders\"?","options":[{"key":"A","text":"A vendor table with 35 wins out of 36"},{"key":"B","text":"A higher mean AUC at 500 orders in one more run"},{"key":"C","text":"More repeats at 500 and 1,000 orders whose paired interval stays above zero"},{"key":"D","text":"Rerunning the curves with random K-fold instead of held-out customers"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A win at a size needs the interval of the paired difference to leave zero on Bustan's own data, with the same held-out customers.","misconceptions":["Counts someone else's datasets as Bustan's evidence: a benchmark sets a hypothesis, it does not settle it","Treats a higher mean as a win: without the interval the sign is not established","","Changes the question: random folds flatter both models and say nothing about new customers"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"What would change Sarab's verdict?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"The zero-shot forecaster scores 0.75 of the floor's quantile loss; the tuned LightGBM scores 0.61. Ahlam asks whether the pretrained model is worth keeping. What is the best answer today?","options":[{"key":"A","text":"Not as a replacement; test where it wins and what it adds to an ensemble first"},{"key":"B","text":"No: it loses to LightGBM, so it has no use"},{"key":"C","text":"Yes: it needs no training, so it should replace LightGBM"},{"key":"D","text":"Yes: it beats the floor, which is all a forecaster must do"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The average hides groups (Session 2) and a weaker model can still lower an ensemble's loss (Session 4). Both are measured today.","misconceptions":["","Equates second place with no value: a model can still win in a group or help an ensemble","Ignores the measured gap because the model needs no training: cheap to run is not the same as good enough","Moves the goalposts: the floor is the minimum, not the target"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"checkpoint-1","title":"Is the zero-shot forecaster useful here?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"For 60 short series the zero-shot forecaster and smoothing differ by -0.009 in scaled quantile loss, with a 95% interval from -0.064 to +0.050. Both trail LightGBM by about 0.19. What do you recommend for new products?","options":[{"key":"A","text":"Switch new products to the zero-shot model, which scored lower"},{"key":"B","text":"Keep smoothing because the two are proven equal"},{"key":"C","text":"Treat short series as unforecastable and order by hand"},{"key":"D","text":"Use the tuned LightGBM, which wins the group, and retest the pretrained model later"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The only difference that leaves zero in this group is LightGBM's lead. The zero-shot against smoothing comparison is undecided.","misconceptions":["Reads a negative mean as a win: the interval crosses zero","Reads a tie as proof of equality and chooses on habit: the evidence says nothing about which is better","Drops the evidence for a guess: the group is measured, and LightGBM wins it clearly",""],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"checkpoint-2","title":"What do you do with this group?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"A planner forecasts dates (the fruit) for next Ramadan by copying last year. Bustan's demand is low on Fridays. Which single lag gives the smallest error over Ramadan and Eid?","options":[{"key":"A","text":"364 days, one Gregorian year in whole weeks"},{"key":"B","text":"357 days, 51 whole weeks"},{"key":"C","text":"354 days, one Hijri year"},{"key":"D","text":"365 days, one calendar year"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"357 days keeps the weekday and lands within three days of the same Hijri date: both cycles are close to aligned.","misconceptions":["Keeps the weekday but forgets that Ramadan moves about eleven days earlier each Gregorian year","","Aligns the Hijri date but lands on another weekday, so every Friday dip is misplaced","Ignores both cycles: a Gregorian year of 365 days fits neither the week nor Ramadan"],"lo":["LO2","LO5"],"day":2,"session":3,"slide":{"deck":"day2","id":"checkpoint-3","title":"Which lag for a Ramadan item?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"An analyst fits stacking weights on all six origins and reports that the stack beats the best single model on origins three to six. What is wrong?","options":[{"key":"A","text":"Four members are too many for six origins"},{"key":"B","text":"The weights were fitted on quantile loss"},{"key":"C","text":"The weights saw the windows they are scored on"},{"key":"D","text":"The best single model was the tuned LightGBM"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Weights for an origin must come from windows that ended before it; otherwise the stack is scored on its own training data.","misconceptions":["Blames the number of models, not the procedure: four members are fine when the weights are fitted honestly","Thinks the loss choice is the flaw: the judged loss is the right one to fit on","","Confuses the comparison: the best single model must be chosen on earlier windows too, but that is not the main fault here"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"checkpoint-4","title":"Was the stack fitted honestly?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"Yesterday's stack beat the tuned LightGBM by 0.4% in scaled quantile loss, with a 95% interval from +0.0012 to +0.0028. What is still missing before Ahlam can decide?","options":[{"key":"A","text":"Nothing: the interval excludes zero, so adopt the stack"},{"key":"B","text":"Six more origins to narrow the interval"},{"key":"C","text":"What 0.4% less loss is worth in riyals, against the cost of running four models"},{"key":"D","text":"A comparison with the seasonal naive floor"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Error and running cost are in different units. Today puts forecast error into riyals: regret.","misconceptions":["Treats a significant gain as a decision: a real gain can still be too small to pay for itself","Asks for more of the same evidence: more origins would narrow the interval, not price the gain","","Changes the comparison: the floor is not the alternative Ahlam is choosing between"],"lo":["LO3"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Is a 0.4% gain worth four models?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"A chilled yoghurt line: a case short costs SAR 12 in margin and goodwill; a case left over costs SAR 36, mostly spoilage. Which quantile of next week's demand should Imad order?","options":[{"key":"A","text":"The 0.75 quantile"},{"key":"B","text":"The 0.33 quantile"},{"key":"C","text":"The median"},{"key":"D","text":"The 0.25 quantile"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"12 / (12 + 36) = 0.25. A leftover costs three times a shortage, so order low.","misconceptions":["Divides the costs the wrong way round: the ratio is underage over the sum, not overage over the sum","Uses the ratio of the two costs, 12 / 36, as if it were the critical ratio","Orders the mean out of habit: that is right only when both costs are equal",""],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"checkpoint-1","title":"Which quantile do you order?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"The plan uses both reefers, so the reefer constraint has zero slack. The two reefers carry 53.5 of their 80 cubic metres. A haulier offers a third reefer for SAR 900 this week. What do you tell Imad?","options":[{"key":"A","text":"Accept: the reefer constraint binds, so more reefers help"},{"key":"B","text":"Decline: re-solving with three reefers would not change the plan, because dairy already fits"},{"key":"C","text":"Accept: a third reefer frees depot space for dry goods"},{"key":"D","text":"Accept: it is cheaper than the SAR 1,703 that capacity is worth"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Zero slack is not value. The depot space limits the plan; the reefers do not.","misconceptions":["Equates zero slack with value: a tight constraint is worth relaxing only if the re-solved plan costs less","","Moves the extra capacity to a constraint it does not relax: a reefer adds no depot space","Uses the depot's value for a different constraint: SAR 1,703 is what 10 m3 of depot space is worth"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"checkpoint-2","title":"Should Imad pay for a third reefer?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"At the origin 2026-05-10 the zero-shot forecaster has the lower scaled quantile loss of the two, yet its orders cost SAR 5,000 more than smoothing's over the four weeks. Which explanation fits?","options":[{"key":"A","text":"The scaled quantile loss was computed wrongly"},{"key":"B","text":"Regret depends on demand, not on the forecaster"},{"key":"C","text":"Its errors fell where they cost most: dairy overage and the Eid al-Adha week"},{"key":"D","text":"Smoothing is the better forecaster for Bustan"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Regret weighs each error by its cost per case and by the quantile the order uses; error weighs them all alike.","misconceptions":["Blames the measure, not the weighting: scaled quantile loss is a fair error measure, it just weighs products and quantiles differently from the cost","Assumes regret ignores the forecast: the orders come directly from each forecaster's quantiles","","Reads a flip at one origin as a verdict: over twelve weeks the ranking returns"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"checkpoint-3","title":"Why did the rankings flip?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"Rice and sugar each run short in 10% of weeks. A planner reports a 1% chance that both run short in the same week. When is that report most wrong?","options":[{"key":"A","text":"When a shared shock, such as a pre-Eid rush, lifts both demands in the same week"},{"key":"B","text":"When both come from the same supplier"},{"key":"C","text":"When each product's days are independent of each other"},{"key":"D","text":"When the forecaster's bands are too wide"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"10% times 10% assumes independence. A shared shock makes shortages arrive together.","misconceptions":["","Confuses a common supplier truck with common demand: the plan fixes the orders, and shortages come from demand","Treats low daily correlation as no risk: the weekly totals still share any common shock","Blames the width of each band: too-wide bands would make each 10% too high, while the 1% is wrong because it multiplies the two as if independent"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"checkpoint-4","title":"How likely are two shortages together?"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"Over twelve weeks LightGBM's orders cost SAR 2,972 a week less than the zero-shot forecaster's, with a 95% interval from -7,820 to +506. Its scaled quantile loss is clearly lower. What do you report?","options":[{"key":"A","text":"LightGBM is better: its error is lower"},{"key":"B","text":"LightGBM probably costs less, but twelve weeks cannot separate the two; keep both on test"},{"key":"C","text":"The two forecasters cost the same"},{"key":"D","text":"Smoothing, because it won at one origin"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The mean favours LightGBM; the interval says the weeks do not prove it. Both facts go in the report.","misconceptions":["Lets error decide a question that was asked in riyals: the lower error does not settle the cost","","Reads an interval that crosses zero as proof of no difference","Uses one origin's flip as the verdict: over twelve weeks the ranking returns"],"lo":["LO4"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"What do you put in front of Ahlam?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"The adversarial classifier separates northern orders from old ones with AUC 0.95, mostly on driver tenure and distance. What can you conclude before any northern outcome is known?","options":[{"key":"A","text":"The late model will fail in the north"},{"key":"B","text":"Drop tenure and distance from the late model"},{"key":"C","text":"Many northern orders have few look-alikes in the training data, so its predictions there are untested"},{"key":"D","text":"The north has a higher late rate"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Adversarial validation measures the inputs only. Whether the model fails is measured on outcomes (Session 2).","misconceptions":["Jumps from different inputs to a failing model: shifted inputs make failure possible, not certain","Treats the strongest shifted features as the problem to delete: dropping them hides the shift and removes real signal","","Confuses input shift with outcome shift: the classifier never saw a late flag"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"checkpoint-1","title":"What does an adversarial AUC of 0.95 tell Shadi?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"Before the north opened, the analyst reported \"AUC 0.87, well calibrated\" from random 5-fold validation on the old depots. Knowing what you know now, what should the report have said?","options":[{"key":"A","text":"A region-held-out AUC near 0.77, and no promise on calibrated probabilities until northern outcomes arrive"},{"key":"B","text":"AUC 0.87, since random folds use the most data"},{"key":"C","text":"A temporal AUC of 0.88, since the north is later in time"},{"key":"D","text":"No estimate at all: nothing measured on old data applies to the north"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The scheme that held out a whole region matched the deployed ranking. Calibration depends on the late rate, which only northern outcomes reveal.","misconceptions":["","Keeps the leaky estimate: random folds put the same customers on both sides","Picks a scheme that leaks across time through repeat customers","Overcorrects: ranking held up under region-held-out validation, only calibration failed"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"checkpoint-2","title":"Which promise can you make Shadi?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"After weighting, coverage in the north is 90.1% overall but 81.0% for institutional customers. Which statement is right?","options":[{"key":"A","text":"The weights are wrong: weighted conformal guarantees 90% in every segment"},{"key":"B","text":"Institutional customers are too few to measure coverage"},{"key":"C","text":"Raising the institutional weights would fix it"},{"key":"D","text":"Weights correct a change in the inputs; the institutional gap is a change in the link, which needs northern outcomes"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Reweighting old orders can only reproduce relationships the old orders had.","misconceptions":["Assumes weighting gives coverage in every subgroup: its guarantee is marginal, over the deployment distribution","Blames sample size: 956 orders are enough to see a 9-point gap","Thinks larger weights fix concept shift: no reweighting of old orders reproduces a link that changed",""],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"checkpoint-3","title":"What did the weights correct?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"A cloud reseller offers the open TabPFN-2.6 weights as a hosted service outside the Kingdom, at SAR 6 per 1,000 predictions, with a strong benchmark score. The task reads Bustan's orders with customer ids. What blocks it first?","options":[{"key":"A","text":"The price per prediction"},{"key":"B","text":"The licence: its outputs are for non-commercial use only"},{"key":"C","text":"The benchmark score is not high enough"},{"key":"D","text":"Only the transfer of personal data outside the Kingdom"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Self-hosting would solve the residency question; a reseller cannot grant commercial rights it does not hold, so only a separate commercial agreement with the model's maker solves the licence.","misconceptions":["Puts cost first: a few riyals per thousand predictions is trivial next to the other two checks","","Treats the benchmark as evidence for Bustan: it is a hypothesis to test on Bustan's own data","Names a real obstacle but not the first: even self-hosted in Riyadh, the licence forbids commercial use"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"checkpoint-4","title":"Which option can Bustan use for late-delivery risk?"},"level":null,"pool":"checkpoint"},{"id":"q-prework-pinball-01","type":"single","prompt":"Pre-work. A forecaster's 0.9 quantile for tomorrow is 120 cases; 100 cases are sold. What is the pinball loss at tau 0.9?","options":[{"key":"A","text":"2"},{"key":"B","text":"18"},{"key":"C","text":"20"},{"key":"D","text":"10"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The forecast is 20 above the actual; above the quantile the loss is (1 - 0.9) x 20 = 2.","misconceptions":["","Charges the over-forecast at tau instead of 1 - tau: 0.9 x 20 is the price of being 20 below","Uses the plain absolute error, which ignores the quantile","Uses half the absolute error, the loss of the median"],"lo":["LO4"],"day":2,"session":1,"slide":{"deck":"day2","id":"pinball-loss","title":"The pinball loss charges a quantile forecast unequally for being low and being high"},"level":"apply","pool":"practice"},{"id":"q-prework-newsvendor-01","type":"single","prompt":"Pre-work. A case short costs SAR 30 and a case left over SAR 10. Next week's demand is roughly normal with mean 400 and standard deviation 50. About how many cases should be ordered?","options":[{"key":"A","text":"400"},{"key":"B","text":"375"},{"key":"C","text":"434"},{"key":"D","text":"466"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The critical ratio is 30 / (30 + 10) = 0.75; its normal quantile is 0.674, so 400 + 0.674 x 50 = 434.","misconceptions":["Orders the mean, right only when a shortage and a leftover cost the same","Turns the ratio the wrong way round and orders below the mean","","Uses the 0.9 quantile: the ratio here is 0.75, not 0.9"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"critical-ratio","title":"Order up to the demand quantile at underage / (underage + overage)"},"level":"apply","pool":"practice"},{"id":"q-prework-lp-01","type":"single","prompt":"Pre-work. Imad writes the week's order as a linear programme. Which of these is a constraint?","options":[{"key":"A","text":"Minimise the cost of trips plus the cost of shortages"},{"key":"B","text":"The number of cases of rice to order"},{"key":"C","text":"The SAR 2,400 a truck trip costs"},{"key":"D","text":"The volume ordered from one supplier fits the trucks booked for it"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A constraint limits the choices: here volume against the capacity of the trucks booked.","misconceptions":["Names the objective, what is minimised, not a limit on the choices","Names a decision variable, which the solver chooses","Names a parameter, a fixed number in the objective",""],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"integer-programme","title":"Variables, an objective and constraints, solved together by HiGHS"},"level":"understand","pool":"practice"},{"id":"q-prework-coverage-01","type":"single","prompt":"Pre-work. A forecaster's 80% bands held the actual demand on 62 of 100 days. What does that tell you?","options":[{"key":"A","text":"The bands are too wide"},{"key":"B","text":"The bands are too narrow: the forecaster is more confident than it should be"},{"key":"C","text":"The median forecast is biased"},{"key":"D","text":"Nothing: 62% is close enough to 80%"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Too few days inside the band means the band is too narrow; quantiles near the tails are too close to the median.","misconceptions":["Reverses the direction: wide bands hold the actual more often, not less","","Confuses coverage with bias: a centred forecast with narrow bands misses on both sides","Ignores the size of the gap: 18 points on 100 days is far outside sampling noise"],"lo":["LO2","LO4"],"day":2,"session":1,"slide":{"deck":"day2","id":"scaled-scores","title":"Divide every error by the series' own scale, or the staples decide alone"},"level":"understand","pool":"practice"},{"id":"q-budget-fair-01","type":"single","prompt":"A pretrained tabular model scores 0.781 AUC in one 40-second run. Your LightGBM scores 0.779 after a search of 103 fits that took 25 seconds. Which comparison is fair?","options":[{"key":"A","text":"The pretrained model wins: it scored higher"},{"key":"B","text":"LightGBM wins: it needed less time"},{"key":"C","text":"Accuracy with intervals for both, and the full time each took, tuning included, on the same folds"},{"key":"D","text":"Neither: models of different families cannot be compared"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A fair table carries both the score with its interval and the total compute, search included, on identical folds.","misconceptions":["Reads a difference of 0.002 without an interval as a win","Judges on time alone and forgets the score","","Gives up a comparison that a shared metric on shared folds makes possible"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"budget-before-search","title":"Write the tuning budget down before you search"},"level":"evaluate","pool":"practice"},{"id":"q-grouped-cv-01","type":"single","prompt":"Bustan's 1,500 customers each place dozens of orders. The late-delivery model will score orders from customers it has never seen. Which cross-validation estimates that?","options":[{"key":"A","text":"Folds grouped by customer, so that no customer is on both sides"},{"key":"B","text":"Random 5-fold, because it uses every order"},{"key":"C","text":"Stratified folds on the late flag"},{"key":"D","text":"Leave-one-order-out"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Only folds that hold whole customers out test the model on customers it has not seen.","misconceptions":["","Mixes a customer's orders across folds, so the model recognises customers","Balances the outcome but still puts each customer on both sides","Leaks the most: every other order of the same customer stays in training"],"lo":["LO1","LO5"],"day":1,"session":1,"slide":{"deck":"day1","id":"customers-repeat","title":"A customer seen in training is recognised, not predicted"},"level":"apply","pool":"practice"},{"id":"q-crossover-01","type":"single","prompt":"At 1,000 orders the pretrained model scores 0.760 and the tuned baseline 0.752; the paired difference is +0.008 with a 95% interval from -0.019 to +0.035. What do you report?","options":[{"key":"A","text":"The pretrained model wins at 1,000 orders"},{"key":"B","text":"The baseline wins: its interval is wider"},{"key":"C","text":"The models are proven equal at 1,000 orders"},{"key":"D","text":"No difference can be told apart at 1,000 orders with these repeats"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An interval that contains zero leaves the sign undecided; more repeats could narrow it.","misconceptions":["Reads the mean as a win when the interval includes zero","Confuses a wider interval with a better model","Reads absence of evidence as proof of equality",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"reading-a-crossover","title":"A crossover counts only where the interval of the difference leaves zero"},"level":"evaluate","pool":"practice"},{"id":"q-overlap-01","type":"single","prompt":"A vendor reports wins on 20 of 24 datasets. You learn that 8 of the 24 were in the suite used to select the model during pretraining. What do you do first?","options":[{"key":"A","text":"Accept the claim: 20 of 24 is a large majority"},{"key":"B","text":"Drop the 8 overlapping datasets and recount with paired intervals"},{"key":"C","text":"Ask for more datasets of the same kind"},{"key":"D","text":"Rerun only the 4 losses"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Datasets the model was selected on cannot test it; recount on the rest, with paired differences and intervals.","misconceptions":["Counts wins without asking whether the test sets were independent of the model","","Adds data without removing the leak","Looks only where the claim failed, keeping the leaked wins"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"pretraining-overlap","title":"A model scored on datasets it was selected on is grading its own homework"},"level":"analyze","pool":"practice"},{"id":"q-scaled-error-01","type":"single","prompt":"Why are forecast errors divided by each series' own naive error before averaging over 400 series?","options":[{"key":"A","text":"So that high-volume staples do not decide the average alone"},{"key":"B","text":"To turn the errors into percentages"},{"key":"C","text":"Because pretrained models need scaled inputs"},{"key":"D","text":"To remove the effect of holidays"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Unscaled, a staple selling hundreds of cases a day outweighs a specialty item selling two.","misconceptions":["","Confuses scaling by a naive error with a percentage error, which fails on zero days","Mixes up scaling the inputs of a model with scaling the scores","Scaling changes the units, not which days are hard"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"scaled-scores","title":"Divide every error by the series' own scale, or the staples decide alone"},"level":"understand","pool":"practice"},{"id":"q-same-windows-01","type":"single","prompt":"A zero-shot forecaster was scored on the last four weeks of data; the supplied benchmarks on six rolling origins over eight months. The zero-shot score is better. What do you conclude?","options":[{"key":"A","text":"The zero-shot forecaster is better"},{"key":"B","text":"The benchmarks are better: they were tested more"},{"key":"C","text":"Nothing yet: score the zero-shot forecaster at the same six origins and horizon"},{"key":"D","text":"Average the two scores"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Different windows have different difficulty; only the same origins, horizon and series make the comparison.","misconceptions":["Compares scores from different windows as if the windows were equally hard","Rewards the number of tests, not their content","","Averages scores that measure different things"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"same-windows","title":"Same origins, same horizon, same series, same scale"},"level":"evaluate","pool":"practice"},{"id":"q-intermittent-01","type":"single","prompt":"Over the last year a catering product sold on one day in three on average (ADI 3.0), with sizes that vary little. How does the lab classify it at that origin?","options":[{"key":"A","text":"Regular"},{"key":"B","text":"Short"},{"key":"C","text":"Ramadan item"},{"key":"D","text":"Intermittent"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An average gap of 1.32 days or more between sales marks a series as intermittent in the lab.","misconceptions":["Looks at the size variability only, not at how often it sells","Confuses many zero days with a short history","Uses a product-master group that this product does not belong to",""],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"classify-from-history","title":"Two numbers describe a demand pattern: how often it sells, and how much the sizes vary"},"level":"apply","pool":"practice"},{"id":"q-future-covariate-01","type":"single","prompt":"Which input may be passed as a known future covariate when forecasting the next 28 days of dates (the fruit) at Riyadh?","options":[{"key":"A","text":"The Ramadan and Eid days in the next 28 days from the Umm al-Qura calendar"},{"key":"B","text":"Next week's actual sales of dates at Jeddah"},{"key":"C","text":"The actual temperature of the next 28 days"},{"key":"D","text":"The total of next month's orders"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The calendar is published in advance, so it is known at the origin.","misconceptions":["","Uses another series' future, which is not known at the origin","Uses actual weather that only a weather forecast could stand in for","Leaks the target itself"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"known-future-covariates","title":"The calendar is a known future covariate; next week's sales are not"},"level":"apply","pool":"practice"},{"id":"q-stack-leak-01","type":"single","prompt":"Stacking weights for the origin 2026-03-15 are fitted on the forecasts of all six origins. What is wrong?","options":[{"key":"A","text":"Nothing: more origins give better weights"},{"key":"B","text":"The weights saw the window they are scored on"},{"key":"C","text":"Six origins are too few for four weights"},{"key":"D","text":"Weights must be fitted per series"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Weights for an origin may use only windows that ended before it.","misconceptions":["Treats more data as always better, even when it includes the test window","","Blames the count of origins instead of the leak","Adds a requirement the method does not have"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"rolling-origin-stacking","title":"Weights for an origin come only from windows that ended before it"},"level":"analyze","pool":"practice"},{"id":"q-simple-average-01","type":"single","prompt":"When is the simple average of four forecasters most likely to lose to the best single one?","options":[{"key":"A","text":"When the four forecasters are about equally good"},{"key":"B","text":"When the series are long"},{"key":"C","text":"When one forecaster is far better than the others"},{"key":"D","text":"When the forecasts are quantiles"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Equal weights give a weak member as much say as the best one; that costs most when quality differs a lot.","misconceptions":["Describes the case where the simple average does well","Series length does not decide whether equal weights fit","","Quantile forecasts can be averaged like point forecasts"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"recap-simple-average","title":"The simple average is hard to beat; learned weights must earn their extra risk"},"level":"understand","pool":"practice"},{"id":"q-gain-interval-01","type":"single","prompt":"A stack beats the best single model by 0.3% in scaled quantile loss, with a 95% bootstrap interval over series from -0.1% to +0.7%. What do you tell Ahlam?","options":[{"key":"A","text":"Adopt the stack: it is better on average"},{"key":"B","text":"Drop the stack: it is worse"},{"key":"C","text":"The stack is proven equal to the best model"},{"key":"D","text":"The gain is not established; keep the single model unless more windows separate them"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An interval that includes zero does not establish a gain, and the stack costs more to run.","misconceptions":["Adopts on a mean whose interval includes zero","Reads an undecided interval as a loss","Reads an undecided interval as proof of equality",""],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"stack-gain-interval","title":"The stack's gain is real and tiny: 0.4%, for running four models"},"level":"evaluate","pool":"practice"},{"id":"q-judged-loss-01","type":"single","prompt":"Forecasts will be judged by scaled quantile loss. On which loss should the stacking weights be fitted?","options":[{"key":"A","text":"Scaled quantile loss, on earlier windows"},{"key":"B","text":"Squared error of the medians, because it is smooth"},{"key":"C","text":"Accuracy of the 0.5 quantile only"},{"key":"D","text":"Whichever loss gives the largest weight to the newest model"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Weights fitted on the judged loss optimise what will be scored; least squares chases large spikes instead.","misconceptions":["","Prefers a convenient loss to the one that is judged","Ignores the 0.1 and 0.9 quantiles that are judged too","Chooses the loss by the answer it gives"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"fit-the-judged-loss","title":"Fit the weights on the loss you will be judged on"},"level":"apply","pool":"practice"},{"id":"q-regret-error-01","type":"single","prompt":"Forecaster A has lower scaled quantile loss than B over a quarter, but A's orders cost more. Which explanation fits best?","options":[{"key":"A","text":"Regret does not depend on the forecaster"},{"key":"B","text":"A's errors fall on products and quantiles where errors cost most"},{"key":"C","text":"The loss was computed on the wrong days"},{"key":"D","text":"B was tuned on the test quarter"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Error weighs every product and quantile alike; regret weighs each error by what it costs in the order it causes.","misconceptions":["Forgets that the orders come from each forecaster's quantiles","","Blames the measure without evidence of a mistake","Invents a leak the question gives no sign of"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"error-vs-regret","title":"Error weighs every quantile and product alike; regret weighs them by what they cost"},"level":"analyze","pool":"practice"},{"id":"q-binding-01","type":"single","prompt":"In the solved plan the limit of two reefers has zero slack. Re-solving with three reefers gives the same objective. What is the third reefer worth this week?","options":[{"key":"A","text":"SAR 3,200, the price of a trip"},{"key":"B","text":"As much as the depot space is worth"},{"key":"C","text":"Nothing: the constraint is tight but does not limit the plan"},{"key":"D","text":"It cannot be known without the dual prices"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The value of relaxing a constraint is the drop in the objective when it is relaxed; here there is none.","misconceptions":["Confuses the cost of a resource with its value to this plan","Transfers the value of another constraint","","Re-solving is the direct way to price a constraint in an integer programme"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"binding-constraints","title":"A constraint binds when it has no slack; it matters when relaxing it lowers the cost"},"level":"evaluate","pool":"practice"},{"id":"q-integer-trucks-01","type":"single","prompt":"The dry goods need 75 cubic metres; a truck carries 60. A linear relaxation books 1.25 trucks. Why are trucks integer variables?","options":[{"key":"A","text":"To make the solver faster"},{"key":"B","text":"Because cases are integers"},{"key":"C","text":"Because 1.25 trucks is easier to round later"},{"key":"D","text":"Because a trip is paid whole: 1.25 trucks underprices the plan"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Half a truck costs a whole trip; a continuous count makes small loads look cheap.","misconceptions":["Integer variables make solving slower, not faster","Cases are integers too, but rounding hundreds of cases barely matters","Rounding after solving can break the other constraints",""],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"why-integers","title":"Half a truck costs a whole trip, so trucks are integer variables"},"level":"understand","pool":"practice"},{"id":"q-joint-shortage-01","type":"single","prompt":"A plan's simulation assumes products are independent and reports a 2% chance that five products run short in the same week. Past errors show a shared weekly shock. What happens to that 2%?","options":[{"key":"A","text":"It rises: shared shocks make shortages arrive together"},{"key":"B","text":"It falls: shared shocks cancel out"},{"key":"C","text":"It stays: each product's own risk is unchanged"},{"key":"D","text":"It cannot change without new orders"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Correlation leaves each product's marginal risk similar but makes joint shortages more likely.","misconceptions":["","Thinks correlated errors offset each other, which only negatively correlated ones do","Looks at each product's own risk and misses the joint event","Forgets that demand, not the plan, carries the shock"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"shared-shocks","title":"One shock shared by all products, one per product-week, one per day"},"level":"analyze","pool":"practice"},{"id":"q-adversarial-01","type":"single","prompt":"An adversarial classifier separates last year's orders from this month's with AUC 0.52. What can you conclude?","options":[{"key":"A","text":"The model will work this month"},{"key":"B","text":"The features show no shift the classifier can see; outcomes may still have shifted"},{"key":"C","text":"There is no shift of any kind"},{"key":"D","text":"The classifier is broken"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Adversarial validation tests the inputs only; label and concept shift need outcomes.","misconceptions":["Jumps from similar inputs to a working model","","Ignores label and concept shift, which the test cannot see","Reads an AUC near 0.5 as a failure, when it is the expected result without input shift"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"adversarial-validation","title":"Train a classifier to tell the old depots from the north: if it can, the inputs have shifted"},"level":"evaluate","pool":"practice"},{"id":"q-temporal-leak-01","type":"single","prompt":"A temporal split trains on the first 80% of days and tests on the last 20%. The same customers order in both periods, and the model will serve a new region's customers. What does the temporal score overstate?","options":[{"key":"A","text":"Nothing: a temporal split never leaks"},{"key":"B","text":"The effect of holidays"},{"key":"C","text":"The size of the region"},{"key":"D","text":"How well the model ranks customers it has not seen"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Repeat customers sit on both sides of the date, so the score rewards recognising them.","misconceptions":["Assumes time order alone removes every leak","Names a seasonal issue unrelated to the leak","Region size does not enter the split",""],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"four-schemes","title":"Each validation scheme answers a different question about the future"},"level":"analyze","pool":"practice"},{"id":"q-weights-correct-01","type":"single","prompt":"Weighted conformal intervals use weights from an adversarial classifier. Which shift can they correct?","options":[{"key":"A","text":"A change in how the features are distributed, with the same link to the outcome"},{"key":"B","text":"A change in the link between distance and lateness"},{"key":"C","text":"Any shift, if the weights are clipped"},{"key":"D","text":"A change in the late rate with the same features"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Density-ratio weights reweight old rows toward the new inputs; they cannot create a link the old rows never had.","misconceptions":["","Expects reweighting to reproduce a relationship that changed","Thinks clipping adds a guarantee; it trades coverage for stability","A change in the outcome rate alone leaves p(x) unchanged, so the weights do not see it"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"density-ratio-weights","title":"Weight each calibration order by how northern it looks"},"level":"understand","pool":"practice"},{"id":"q-hijri-validation-01","type":"single","prompt":"A demand model was validated on January and February 2026 and will forecast the weeks before Eid al-Fitr 1448. Which validation estimates that error?","options":[{"key":"A","text":"The January and February scores, since they are recent"},{"key":"B","text":"Random days from the last year"},{"key":"C","text":"Rolling origins whose test windows covered the weeks before the past Eids al-Fitr"},{"key":"D","text":"A split by product"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Ramadan moves about eleven days a year; only test windows that held past pre-Eid weeks measure that season.","misconceptions":["Takes recent for representative, though the season differs","Mixes days from all seasons and leaks neighbouring days","","Holds products out, which answers a different question"],"lo":["LO2","LO5"],"day":2,"session":3,"slide":{"deck":"day2","id":"two-cycles","title":"Demand follows the week and the Hijri year at once, and they do not line up"},"level":"apply","pool":"practice"},{"id":"q-licence-outputs-01","type":"single","prompt":"A model's weights are free to download, but its licence says its outputs may be used for non-commercial purposes only. Bustan wants it to set weekly orders. What follows?","options":[{"key":"A","text":"Allowed: downloading was free"},{"key":"B","text":"Allowed if it runs on Bustan's own servers"},{"key":"C","text":"Allowed once its accuracy beats the baseline"},{"key":"D","text":"Not allowed without a separate commercial licence"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Setting orders is commercial use of the outputs, which the licence excludes wherever the model runs.","misconceptions":["Confuses free access with permitted use","Thinks hosting changes the licence: residency and licence are separate checks","Lets accuracy override a licence condition",""],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"licences","title":"Three candidates allow commercial use; TabPFN-2.6 restricts even its outputs"},"level":"evaluate","pool":"practice"},{"id":"q-residency-01","type":"single","prompt":"Bustan's order records hold customer ids of sole traders. A candidate runs only as a cloud endpoint outside the Kingdom. What must happen before those records are sent?","options":[{"key":"A","text":"Nothing, if the data is encrypted in transit"},{"key":"B","text":"A purpose allowed by the Personal Data Protection Law, a transfer risk assessment and appropriate safeguards, or self-hosting instead"},{"key":"C","text":"Only the customers' consent by email"},{"key":"D","text":"A faster network link"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The PDPL's Article 29 and the transfer regulation set the conditions; self-hosting in the Kingdom avoids the transfer.","misconceptions":["Treats encryption as a substitute for the legal conditions","","Reduces the conditions to consent alone","Answers a technical question that was not asked"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"residency","title":"Orders hold personal data: leaving the Kingdom needs a purpose, a risk assessment and safeguards"},"level":"apply","pool":"practice"},{"id":"q-cost-decides-01","type":"single","prompt":"Running a pretrained forecaster costs about SAR 50 a month self-hosted. The course's evidence shows it does not beat the tuned LightGBM overall. What is the adoption decision?","options":[{"key":"A","text":"Adopt it: it is cheap"},{"key":"B","text":"Adopt it for every series: it needs no training"},{"key":"C","text":"Not as a replacement; at most as a member where it adds measured value, such as holiday windows"},{"key":"D","text":"Reject pretrained forecasters for good"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Low cost does not make a model useful; adopt where the evidence shows value, with that condition written down.","misconceptions":["Lets a low price stand in for evidence","Takes no training for no cost of being wrong","","Generalises one result to every future model"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"adoption-table","title":"One go with conditions, two not now, one no-go"},"level":"evaluate","pool":"practice"},{"id":"q-four-checks-01","type":"single","prompt":"A candidate has an Apache-2.0 licence, can be self-hosted in Riyadh and costs little to run, but it was never evaluated on Bustan's data. What is the right decision today?","options":[{"key":"A","text":"Not now: evaluate it on Bustan's data first"},{"key":"B","text":"Go: the licence, residency and cost all allow it"},{"key":"C","text":"No-go: unevaluated models are never adopted"},{"key":"D","text":"Go with conditions: monitor it after adoption"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Accuracy is one of the four checks; without evidence on Bustan's data it is not met yet.","misconceptions":["","Skips the accuracy check","Turns 'not yet evaluated' into a permanent refusal","Moves the evaluation after the decision it should inform"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"four-checks","title":"A model is adopted when accuracy, licence, data and cost all allow it"},"level":"understand","pool":"practice"}]}</script>
